# .gitlab-ci.yml
image: inovex/gitlab-ci-android  # Образ с Android SDK, NDK, Gradle [[12]]

stages:
  - build
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"  # JDK 17 для совместимости

cache:
  key: ${CI_PROJECT_ID}
  paths:
    - .gradle/

before_script:
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - chmod +x ./gradlew

build_apk:
  stage: build
  script:
    # Клонируем репозиторий с правильным доменом
    - git clone --depth=1 https://git.hmmr.ru/timurmalyshev/android-gps-warehouse-app.git .
    - chmod +x ./gradle
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/  # только v1.2.3, v2.0.0 и т.д.

# Автоматическое обновление на сервер при новой версии apk
notify_deploy:
  stage: deploy
  script:
    - curl -X POST http://10.168.143.7:8100/sync
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/  # только v1.2.3 и т.д.
      when: on_success